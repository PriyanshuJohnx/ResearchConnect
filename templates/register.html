<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Researcher Registration - ResearchConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4">
                <h2 class="text-center mb-4">Create Researcher Account</h2>

                <form id="registerForm">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Research Interests</label>
                        <textarea id="research_interests" class="form-control" rows="3"
                            placeholder="Example: Artificial Intelligence, Machine Learning"
                            required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Register
                    </button>

                </form>

                <p class="text-center mt-3">
                    Already have an account?
                    <a href="/">Login here</a>
                </p>

                <div id="message" class="mt-3 text-center"></div>

            </div>
        </div>
    </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const researcher = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        research_interests: document.getElementById("research_interests").value
    };

    try {
        const response = await fetch("/users", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(researcher)
        });

        const result = await response.json();

        if (response.ok) {
            document.getElementById("message").innerHTML =
                '<span class="text-success">Registration successful! You can now log in.</span>';

            document.getElementById("registerForm").reset();
        } else {
            document.getElementById("message").innerHTML =
                '<span class="text-danger">' + result.detail + '</span>';
        }

    } catch (error) {
        document.getElementById("message").innerHTML =
            '<span class="text-danger">Something went wrong. Please try again.</span>';
    }
});
</script>

</body>
</html>
