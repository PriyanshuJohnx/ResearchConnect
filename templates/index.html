<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ResearchConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .brand {
            color: #0d6efd;
            font-weight: bold;
            font-size: 30px;
        }

        .login-btn {
            background: #0d6efd;
            color: white;
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
        }

        .login-btn:hover {
            background: #084298;
        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="text-center mb-4">

            <h1 class="brand">ResearchConnect</h1>

            <p class="text-muted">
                Research Collaboration & Publication Recommendation System
            </p>

            <h4 class="mt-4">Welcome Back!</h4>

            <p class="text-muted">Login to your researcher account</p>

        </div>

        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label">Email Address</label>

                <input type="email"
                       id="email"
                       class="form-control"
                       placeholder="Enter your email"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">Password</label>

                <input type="password"
                       id="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div id="message" class="text-center mt-3"></div>

        <hr>

        <p class="text-center mb-0">

            Don't have an account?

            <a href="/register" class="text-primary fw-bold">
                Sign Up
            </a>

        </p>

    </div>


    <script>

        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const credentials = {
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(credentials)

                });

                const result = await response.json();

                if (response.ok) {

                    document.getElementById("message").innerHTML =
                        '<span class="text-success">Login successful! Redirecting...</span>';

                    window.location.href = "/dashboard";

                } else {

                    document.getElementById("message").innerHTML =
                        '<span class="text-danger">' + result.detail + '</span>';

                }

            } catch (error) {

                document.getElementById("message").innerHTML =
                    '<span class="text-danger">Something went wrong. Please try again.</span>';

            }

        });

    </script>

</body>
</html>
